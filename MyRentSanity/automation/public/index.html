<!-- MyRent uses Poppins; falls back to the system font when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root {
    color-scheme: light dark;
    /* MyRent look (reference: the MyRent web app's home page): white header and
       cards on a light grey page, MyRent yellow (#FFCA00) for emphasis and actions.
       Status colours (pass / fail / running) stay semantic. */
    --brand-yellow: #FFCA00;
    --brand-yellow-strong: #e6b600;
    --brand-yellow-soft: #fff3c2;
    --brand-orange: #FFCA00;
    --brand-orange-strong: #e6b600;
    --brand-orange-soft: #fff3c2;
    --bg: #f4f4f5;
    --wash: rgba(255, 202, 0, 0.06);
    --header-bg: #ffffff;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --muted: #6b7280;
    --border: #e7e7ea;
    --border-strong: #cfd2d8;
    --hover-bg: rgba(255, 202, 0, 0.1);
    --accent: var(--brand-orange);
    --accent-strong: var(--brand-orange-strong);
    --accent-soft: var(--brand-yellow-soft);
    --logo-text: #2b2b2b;
    --pass: #16874a;
    --pass-bg: #e5f7ec;
    --fail: #c22e3f;
    --fail-bg: #fdecee;
    --running: #d96c00;
    --running-bg: #fff0df;
    --pending-bg: #f0f0f2;
    --log-bg: #1f2227;
    --log-text: #e2e5ea;
    --log-step: #a3abb8;
    --log-fail: #ff8a93;
    --log-meta: #8d95a3;
    --log-pass: #5fd996;
    --log-noise: #656c79;
    --log-section-bg: #FFCA00;
    --log-section-text: #2b2400;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.1);
    --header-shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --brand-yellow-soft: rgba(255, 202, 0, 0.14);
      --brand-orange-soft: rgba(255, 202, 0, 0.16);
      --bg: #15171b;
      --wash: rgba(255, 202, 0, 0.05);
      --header-bg: #1d2025;
      --card-bg: #1f2227;
      --text: #eef0f3;
      --muted: #a0a8b5;
      --border: #2d3139;
      --border-strong: #404652;
      --hover-bg: rgba(255, 202, 0, 0.08);
      --logo-text: #f3f4f6;
      --pass: #5fd996;
      --pass-bg: #163a28;
      --fail: #ff8a93;
      --fail-bg: #3d1b22;
      --running: #ffa94d;
      --running-bg: #3d2a12;
      --pending-bg: #292d35;
      --log-bg: #0f1114;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
      --header-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.6 "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(1000px 380px at 50% -160px, var(--wash), transparent 70%);
  }
  :focus-visible { outline: 2px solid var(--brand-orange); outline-offset: 2px; }

  /* ---- Header: the MyRent logo, then the tool's name ---- */
  header {
    background: var(--header-bg);
    padding: 16px 32px 0;
    box-shadow: var(--header-shadow);
    position: relative;
    z-index: 6;
  }
  .brand { display: flex; align-items: center; gap: 22px; max-width: 1280px; margin: 0 auto; padding-bottom: 14px; }
  .logo { flex: none; height: 54px; width: auto; display: block; }
  /* Two official logos (transparent PNGs): black wordmark for the light theme, white wordmark for the dark
     theme — so the logo sits straight on the header with no white box behind it. */
  .logo-on-dark { display: none; }
  @media (prefers-color-scheme: dark) { .logo-on-light { display: none; } .logo-on-dark { display: block; } }
  .brand-divider { flex: none; width: 1px; align-self: stretch; background: var(--border-strong); margin: 4px 0; }
  .brand-text { min-width: 0; }
  .tool-pill {
    display: inline-block;
    background: var(--brand-yellow);
    color: #3a2d00;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 10px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: 0.01em; line-height: 1.25; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .header-bar { height: 4px; margin: 0 -32px; background: linear-gradient(90deg, var(--brand-yellow), var(--brand-orange)); }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 24px 60px; }

  /* ---- Controls: like MyRent's filter card ---- */
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: color-mix(in srgb, var(--card-bg) 94%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 22px 0 20px;
    box-shadow: var(--shadow-sm);
  }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .controls input[type="number"] {
    width: 58px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    text-transform: none;
    letter-spacing: 0;
    accent-color: var(--brand-orange);
  }
  .controls input[type="checkbox"] { accent-color: var(--brand-orange); width: 16px; height: 16px; }
  .controls select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    text-transform: none;
    letter-spacing: 0;
  }
  .controls input[type="number"]:focus, .controls select:focus { border-color: var(--brand-orange); outline: none; box-shadow: 0 0 0 3px var(--brand-orange-soft); }
  .controls select:disabled { opacity: 0.6; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px 5px 11px;
    border-radius: 999px;
    background: var(--pending-bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    min-width: 96px;
    text-transform: none;
    letter-spacing: 0;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .status-pill::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .status-pill.running { background: var(--running-bg); color: var(--running); }
  .status-pill.running::before { animation: pulseDot 1.1s ease-in-out infinite; }

  /* Primary action: solid MyRent yellow. */
  #runBtn {
    margin-left: auto;
    background: var(--brand-orange);
    color: #2b2400;
    border: 1.5px solid var(--brand-orange);
    padding: 9px 26px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(255, 202, 0, 0.4);
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease, opacity 0.2s ease;
  }
  #runBtn:hover:not(:disabled) { background: var(--brand-orange-strong); border-color: var(--brand-orange-strong); }
  #runBtn:active:not(:disabled) { transform: translateY(1px); }
  #runBtn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }

  #runBanner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 10px;
    margin: 18px 0 0;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    animation: slideDown 0.2s ease;
  }
  #runBanner.pass { display: flex; background: var(--pass-bg); color: var(--pass); }
  #runBanner.fail { display: flex; background: var(--fail-bg); color: var(--fail); }
  #runBanner.stopped { display: flex; background: var(--pending-bg); color: var(--muted); }
  #runBanner::before { content: '●'; font-size: 10px; }

  /* ---- Suite cards: white cards, soft shadow, a coloured left edge for state ---- */
  .suite-card {
    position: relative;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 5px solid var(--brand-yellow);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    transition: border-left-color 0.3s ease, box-shadow 0.3s ease;
  }
  .suite-card[data-status="running"] { border-left-color: var(--running); box-shadow: var(--shadow-md); }
  .suite-card[data-status="passed"] { border-left-color: var(--pass); }
  .suite-card[data-status="failed"] { border-left-color: var(--fail); }

  .progress-track {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: transparent;
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--brand-orange), transparent);
    opacity: 0;
  }
  .suite-card[data-status="running"] .progress-fill {
    opacity: 1;
    animation: indeterminate 1.3s ease-in-out infinite;
  }

  .suite-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .suite-head input[type="checkbox"] { margin-top: 5px; accent-color: var(--brand-orange); width: 16px; height: 16px; flex: none; }
  .suite-title-row { flex: 1 1 320px; min-width: 0; }
  .suite-title-row h2 {
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .suite-title-row p.purpose { margin: 0 0 8px; color: var(--text); }
  .suite-title-row p.known {
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    display: flex;
    gap: 7px;
    align-items: flex-start;
  }
  .known-icon {
    flex: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--brand-yellow);
    color: #3a2d00;
    font-size: 10px;
    font-weight: 700;
    line-height: 15px;
    text-align: center;
    margin-top: 2px;
  }

  .suite-status-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 9px;
    flex: none;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 4px 11px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 6px;
  }
  .badge.running::before { animation: pulseDot 1.1s ease-in-out infinite; }
  .badge.pending { background: var(--pending-bg); color: var(--muted); }
  .badge.queued { background: var(--brand-yellow-soft); color: #8a6500; font-style: italic; }
  .badge.running { background: var(--running-bg); color: var(--running); }
  .badge.passed { background: var(--pass-bg); color: var(--pass); }
  .badge.failed { background: var(--fail-bg); color: var(--fail); }
  .badge.stopped { background: var(--pending-bg); color: var(--muted); }
  @media (prefers-color-scheme: dark) { .badge.queued { color: #f3c94d; } }

  .suite-actions { display: flex; gap: 8px; }

  /* Secondary actions: MyRent's outlined yellow, uppercase. */
  .run-one {
    background: transparent;
    border: 1.5px solid var(--brand-orange);
    color: var(--text);
    padding: 5px 16px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, opacity 0.2s ease;
  }
  .run-one:hover:not(:disabled) { background: var(--brand-orange); color: #2b2400; }
  .run-one:disabled { opacity: 0.4; cursor: default; background: transparent; }

  .end-one {
    background: transparent;
    border: 1.5px solid var(--fail);
    color: var(--fail);
    padding: 5px 16px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.15s ease, opacity 0.2s ease;
  }
  .end-one:hover:not(:disabled) { background: var(--fail-bg); }
  .end-one:disabled { opacity: 0.35; cursor: default; background: transparent; }
  /* Only ever shown on the one suite actually running — see setBadge(). */
  .end-one[hidden] { display: none; }

  .attempt-note {
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0 0 var(--indent);
    --indent: 28px;
  }
  .attempt-note::before { content: '⟳  '; }

  .spec-list { list-style: none; margin: 12px 0 0 28px; padding: 0; }
  .spec-list li {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 4px 6px;
    margin: 0 -6px;
    border-radius: 6px;
    font-size: 13px;
    animation: fadeSlideIn 0.25s ease;
  }
  .spec-list li:not(.empty-row):hover { background: var(--hover-bg); }
  .spec-list .tag { font-weight: 700; font-size: 11px; width: 52px; flex: none; }
  .spec-list .tag.pass { color: var(--pass); }
  .spec-list .tag.fail { color: var(--fail); }
  .spec-list li.empty-row {
    color: var(--muted);
    font-size: 12.5px;
    font-style: italic;
    padding: 10px 12px;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    margin: 4px -6px 0;
  }
  .spec-cause { color: var(--muted); font-size: 12px; margin-left: 46px; }

  /* Results table: gold header row, like MyRent's active tab. */
  .step-table {
    border-collapse: separate;
    border-spacing: 0;
    width: calc(100% - 20px);
    margin: 6px 0 12px 20px;
    font-size: 12.5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .step-table th, .step-table td {
    padding: 7px 11px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: top;
  }
  .step-table tr:last-child td { border-bottom: none; }
  .step-table th {
    background: var(--brand-yellow);
    color: #3a2d00;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: none;
  }
  .step-table td.step-result { font-weight: 700; white-space: nowrap; }
  .step-table td.step-num { color: var(--muted); width: 1%; white-space: nowrap; }
  .step-table td.step-time { color: var(--muted); white-space: nowrap; width: 1%; }
  .step-table tr.pass td.step-result { color: var(--pass); }
  .step-table tr.fail td.step-result { color: var(--fail); }
  .step-table tr.known td.step-result { color: var(--running); }
  .step-table tr.running td.step-result { color: var(--running); }
  .step-table tr.running td { background: var(--brand-orange-soft); }
  .step-table tr.notrun td, .step-table tr.pending td { color: var(--muted); }
  .step-table tr.fail td { background: var(--fail-bg); }
  .step-table td.step-evidence { line-height: 1.5; }
  .step-table tr.pass td.step-evidence { color: var(--pass); }
  .step-table tr.fail td.step-evidence .reason { color: var(--fail); font-weight: 600; }
  .step-table .last-action { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .step-table details { margin-top: 4px; font-size: 11.5px; }
  .step-table details summary { cursor: pointer; color: var(--muted); }
  .step-table details pre {
    margin: 4px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--muted);
  }

  details.log { margin: 14px 0 0 28px; }
  details.log summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    user-select: none;
  }
  details.log summary:hover { color: var(--text); }
  pre.log-body {
    background: var(--log-bg);
    color: var(--log-text);
    border-radius: 8px;
    padding: 12px 14px;
    height: 240px;
    min-height: 120px;
    max-height: 80vh;
    overflow: auto;
    resize: vertical;
    font-size: 12px;
    line-height: 1.7;
    margin: 8px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
    border-top: 3px solid var(--brand-yellow);
  }
  pre.log-body:empty::before {
    content: 'No output yet.';
    color: var(--log-meta);
    font-style: italic;
  }
  .log-line { display: block; }
  .log-line.log-step { color: var(--log-step); }
  .log-line.log-fail { color: var(--log-fail); font-weight: 600; }
  .log-line.log-meta { color: var(--log-meta); font-style: italic; }
  /* Start of each test step ("Quotation via Menu hover", …) — a solid bar so
     each entry point's lines are visibly separated from the next one's. */
  .log-line.log-section {
    background: var(--log-section-bg);
    color: var(--log-section-text);
    font-weight: 700;
    padding: 3px 10px;
    margin: 14px -6px 4px;
    border-radius: 5px;
    letter-spacing: 0.01em;
  }
  .log-line.log-section:first-child { margin-top: 0; }
  .log-line.log-pass { color: var(--log-pass); font-weight: 600; }
  /* Known-harmless app noise (see KNOWN_BENIGN_NOISE_PATTERNS in jsonReport.mts) — kept, but out of the way. */
  .log-line.log-noise { color: var(--log-noise); font-size: 11px; }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(1.5); }
  }
  @keyframes indeterminate {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }

  .suite-card.unavailable { opacity: 0.55; }
  .unavailable-note { display: none; margin-top: 6px; font-size: 0.85em; font-weight: 600; }
  .suite-card.unavailable .unavailable-note { display: block; }
  #instanceNote { flex-basis: 100%; font-size: 0.85em; }
  #instanceNote:empty { display: none; }

  @media (max-width: 720px) {
    header { padding: 14px 16px 0; }
    .header-bar { margin: 0 -16px; }
    .brand { gap: 14px; }
    .brand-divider { display: none; }
    .logo { height: 38px; }
    main { padding: 8px 14px 50px; }
  }
  @media (max-width: 560px) {
    .suite-status-col { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
  }

  /* ---- Environment switch: Tenant-based / Multitenant (UI only for now) ----
     Additive: nothing above is changed. Picking Multitenant opens the separate /mt/ page. */
  .controls label[hidden] { display: none; }

  /* Environment: a step larger and bolder than the other controls so it reads as the top-level switch. */
  .controls label:has(#environment) { font-size: 15px; font-weight: 700; color: var(--text); }
  .controls label:has(#environment) select { font-size: 15px; font-weight: 600; padding: 7px 12px; }
</style>
</head>

    <div class="brand-text">
      <span class="tool-pill">Sanity Tool</span>
      <h1>MyRent Sanity Dashboard</h1>
      <p>Runs MyRent's creation-flow suites as separate Playwright processes and shows live, per-suite progress.</p>

<main>
  <div id="runBanner"></div>

  <div class="controls">
    <label>Environment
      <select id="environment">
        <option value="tenant" selected>Tenant-based</option>
        <option value="multitenant">Multitenant</option>
      </select>
    </label>
    <label id="tenantInstanceLabel">Instance
      <select id="instance"></select>
    </label>
    <label>Run as
      <select id="role">
        <option value="administrator">Administrator</option>
        <option value="operator">Operator</option>
      </select>
    </label>
    <label>Retries <input type="number" id="retries" min="0" value="1" /></label>
    <label><input type="checkbox" id="headed" checked /> Visible browser</label>
    <span id="runStatus" class="status-pill">Loading…</span>
    <button id="runBtn" disabled>Run Selected</button>
    <div id="instanceNote"></div>
  </div>

  <div id="suites"></div>
</main>

<script>
(function () {
  const suitesEl = document.getElementById('suites');
  const runBtn = document.getElementById('runBtn');
  const runStatus = document.getElementById('runStatus');
  const runBanner = document.getElementById('runBanner');
  const retriesInput = document.getElementById('retries');
  const headedInput = document.getElementById('headed');
  const roleSelect = document.getElementById('role');
  const instanceSelect = document.getElementById('instance');
  const instanceNote = document.getElementById('instanceNote');

  /** @type {Record<string, any>} suiteId -> suite metadata from /api/suites */
  let suiteMeta = {};
  /** Role of the run currently in progress (or most recently finished) — carried from run-start to run-done for the banner. */
  let currentRunRole = 'administrator';
  /** Instance of the run currently in progress (or most recently finished) — same purpose as currentRunRole. */
  let currentRunInstance = 'testee';
  /** @type {Record<string, any>} instanceId -> {id, title, excludedSuites, unverified} from /api/instances */
  let instanceMeta = {};
  /** Whether a run is currently in progress — runs requested while true are queued, not rejected. */
  let isRunning = false;
  /** Number of runs waiting behind the current one. */
  let queueLength = 0;
  /** @type {Record<string, HTMLElement>} suiteId -> its card's DOM refs */
  const cardRefs = {};

  // Mirrors playwrightRunner.mts's attemptPassed() — `[].every(...)` is
  // vacuously true, so a crashed (zero-spec) attempt must be checked for
  // explicitly rather than trusting a bare .every() here too.
  function finalAttemptPassed(finalAttempt) {
    return (
      finalAttempt.specs.length > 0 &&
      finalAttempt.exitCode === 0 &&
      finalAttempt.specs.every((s) => s.status === 'passed' || s.status === 'skipped')
    );
  }

  function badgeLabel(status) {
    return (
      { pending: 'PENDING', queued: 'QUEUED', running: 'RUNNING', passed: 'PASS', failed: 'FAIL', stopped: 'STOPPED' }[status] ||
      status.toUpperCase()
    );
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // Mirrors KNOWN_BENIGN_NOISE_PATTERNS in jsonReport.mts — lines this app
  // logs on nearly every page, pass or fail.
  const NOISE_PATTERNS = [
    /^\[CONSOLE ERROR\].*bootstrap-datepicker.*MIME type/,
    /^\[PAGE ERROR\].*r is not a constructor/,
    /^\[PAGE ERROR\].*Cannot set properties of undefined \(setting 'newInputEl'\)/,
  ];
  const SUCCESS_STEP_PATTERN = /successfully|update saved|Movement closed|Invoice generated|Invoice created/i;

  function formatLogLine(line) {
    // [SECTION] / [PLAN] are fixtures/sanityStep.ts markers. [PLAN] is only
    // there for the results table, so it's not shown in the log.
    const section = line.match(/^\[SECTION\] (.+)$/);
    if (section) return `<span class="log-line log-section">▶ ${escapeHtml(section[1])}</span>`;
    if (/^\[PLAN\] /.test(line)) return '';
    let cls = '';
    if (/^\[STEP FAILED\]/.test(line) || /^\s*x\s+\d+\s+\[/.test(line) || /^\s*(TimeoutError|Error):/.test(line)) cls = ' log-fail';
    else if (/^\[EVIDENCE\]/.test(line) || /^\s*ok\s+\d+\s+\[/.test(line)) cls = ' log-pass';
    else if (/^\[STEP\]/.test(line)) cls = SUCCESS_STEP_PATTERN.test(line) ? ' log-pass' : ' log-step';
    else if (/^\[dashboard\]/.test(line)) cls = ' log-meta';
    else if (NOISE_PATTERNS.some((p) => p.test(line))) cls = ' log-noise';
    return `<span class="log-line${cls}">${escapeHtml(line)}</span>`;
  }

  // Live per-step progress, built from the log stream while a suite runs
  // ([PLAN] lists every step, [SECTION] marks one starting, [EVIDENCE] marks
  // it passing). Replaced by the authoritative table from the JSON report
  // once the attempt finishes — only that one knows which step failed and why.
  const liveSteps = {};

  function resetLiveSteps(suiteId) {
    liveSteps[suiteId] = { rows: [] };
  }

  function trackLiveStep(suiteId, line) {
    const live = liveSteps[suiteId] || (liveSteps[suiteId] = { rows: [] });
    const plan = line.match(/^\[PLAN\] (.+)$/);
    if (plan) {
      try {
        live.rows = JSON.parse(plan[1]).map((title) => ({ title: String(title), state: 'pending', evidence: '' }));
      } catch (_) {
        // Malformed plan line — fall back to rows appearing as steps start.
      }
      return true;
    }
    const section = line.match(/^\[SECTION\] (.+)$/);
    if (section) {
      let row = live.rows.find((r) => r.title === section[1]);
      if (!row) live.rows.push((row = { title: section[1], state: 'pending', evidence: '' }));
      row.state = 'running';
      row.evidence = '';
      return true;
    }
    const current = live.rows.find((r) => r.state === 'running');
    if (!current) return false;
    const evidence = line.match(/^\[EVIDENCE\] (.+)$/);
    if (evidence) {
      current.state = 'passed';
      current.evidence = evidence[1];
      return true;
    }
    const step = line.match(/^\[STEP\] (.+)$/);
    if (step) {
      current.evidence = step[1];
      return true;
    }
    return false;
  }

  function renderLiveTable(suiteId) {
    const ref = cardRefs[suiteId];
    const live = liveSteps[suiteId];
    if (!live || live.rows.length === 0 || ref.card.dataset.status !== 'running') return;
    const rows = live.rows.map((r, i) => {
      const result = { pending: '○ Waiting', running: '⏳ Running', passed: '✅ Passed' }[r.state];
      const cls = r.state === 'passed' ? 'pass' : r.state;
      const evidence = r.state === 'running' && r.evidence ? `Now: ${r.evidence}` : r.evidence;
      return stepRowHtml(i + 1, r.title, cls, result, `<div>${escapeHtml(evidence)}</div>`, '');
    });
    ref.specList.innerHTML = `<li style="display:block">${stepTableHtml(rows.join(''))}</li>`;
  }

  function emptyStateText(status) {
    if (status === 'running') return 'Waiting for the first result…';
    if (status === 'queued') return 'Queued — will start once the current run finishes.';
    if (status === 'stopped') return 'Stopped before finishing.';
    if (status === 'passed' || status === 'failed') return 'No spec results reported for this run.';
    return 'Not run yet this session — click Run to see results here.';
  }

  function renderSuiteCard(suite) {
    const card = document.createElement('div');
    card.className = 'suite-card';
    card.dataset.status = 'pending';
    card.innerHTML = `
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="suite-head">
        <input type="checkbox" class="pick" checked />
        <div class="suite-title-row">
          <h2>${suite.title}</h2>
          <p class="purpose">${suite.purpose}</p>
          <p class="known"><span class="known-icon" aria-hidden="true">i</span><span>${suite.knownBehavior}</span></p>
          <p class="unavailable-note"></p>
        </div>
        <div class="suite-status-col">
          <span class="badge pending">PENDING</span>
          <div class="suite-actions">
            <button class="run-one" type="button" disabled>Run</button>
            <button class="end-one" type="button" hidden>End</button>
          </div>
        </div>
      </div>
      <div class="attempt-note" style="display:none"></div>
      <ul class="spec-list"></ul>
      <details class="log">
        <summary>Live log</summary>
        <pre class="log-body"></pre>
      </details>
    `;
    suitesEl.appendChild(card);
    cardRefs[suite.id] = {
      card,
      checkbox: card.querySelector('.pick'),
      badge: card.querySelector('.badge'),
      runOneBtn: card.querySelector('.run-one'),
      endOneBtn: card.querySelector('.end-one'),
      attemptNote: card.querySelector('.attempt-note'),
      specList: card.querySelector('.spec-list'),
      logBody: card.querySelector('.log-body'),
      unavailableNote: card.querySelector('.unavailable-note'),
    };
    cardRefs[suite.id].runOneBtn.addEventListener('click', () => triggerRun([suite.id]));
    cardRefs[suite.id].endOneBtn.addEventListener('click', () => stopRun(suite.id));
    renderSpecs(suite.id, [], 'pending');
  }

  function setBadge(suiteId, status) {
    const ref = cardRefs[suiteId];
    ref.badge.className = 'badge ' + status;
    ref.badge.textContent = badgeLabel(status);
    ref.card.dataset.status = status;
    // Only the one suite actually running (server enforces a single
    // in-flight `playwright test` process at a time) ever shows End — ending
    // it stops the whole in-progress batch, not just this one suite.
    const running = status === 'running';
    ref.endOneBtn.hidden = !running;
    ref.endOneBtn.disabled = !running;
    if (running) ref.endOneBtn.textContent = 'End';
  }

  function setAttemptNote(suiteId, attemptNumber, maxAttempts) {
    const ref = cardRefs[suiteId];
    if (maxAttempts > 1) {
      ref.attemptNote.style.display = '';
      ref.attemptNote.textContent = `attempt ${attemptNumber}/${maxAttempts}`;
    } else {
      ref.attemptNote.style.display = 'none';
    }
  }

  function appendLog(suiteId, line) {
    const ref = cardRefs[suiteId];
    ref.logBody.insertAdjacentHTML('beforeend', formatLogLine(line));
    ref.logBody.scrollTop = ref.logBody.scrollHeight;
    if (trackLiveStep(suiteId, line)) renderLiveTable(suiteId);
  }

  function clearLog(suiteId) {
    cardRefs[suiteId].logBody.innerHTML = '';
    resetLiveSteps(suiteId);
  }

  function renderSpecs(suiteId, specs, status) {
    const ref = cardRefs[suiteId];
    ref.specList.innerHTML = '';
    if (specs.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-row';
      li.textContent = emptyStateText(status);
      ref.specList.appendChild(li);
      return;
    }
    for (const spec of specs) {
      const passed = spec.status === 'passed' || spec.status === 'skipped';
      const li = document.createElement('li');
      const seconds = (spec.durationMs / 1000).toFixed(1);
      li.innerHTML = `<span class="tag ${passed ? 'pass' : 'fail'}">${passed ? '✓ PASS' : '✕ FAIL'}</span><span>${escapeHtml(spec.title)} (${seconds}s)</span>`;
      ref.specList.appendChild(li);
      if (!passed) {
        const cause = document.createElement('div');
        cause.className = 'spec-cause';
        cause.textContent = spec.hasDiagnosedCause
          ? 'cause diagnosed — see live log'
          : 'cause undiagnosed — see README "Transient server-side flakiness"';
        ref.specList.appendChild(cause);
      }
      const wrapper = document.createElement('li');
      wrapper.style.display = 'block';
      wrapper.innerHTML = spec.steps && spec.steps.length > 0 ? renderStepTable(spec.steps) : renderSingleSpecTable(spec, passed);
      ref.specList.appendChild(wrapper);
    }
  }

  function stepTableHtml(rowsHtml) {
    return `<table class="step-table">
      <thead><tr><th>#</th><th>Step</th><th>Result</th><th>Details</th><th>Time</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function stepRowHtml(num, title, cls, resultLabel, detailsHtml, time) {
    return `<tr class="${cls}">
      <td class="step-num">${num}</td>
      <td>${escapeHtml(title)}</td>
      <td class="step-result">${resultLabel}</td>
      <td class="step-evidence">${detailsHtml}</td>
      <td class="step-time">${time}</td>
    </tr>`;
  }

  function formatDuration(ms) {
    if (!ms) return '';
    const s = Math.round(ms / 1000);
    return s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  }

  /** Failure cell: plain-English reason, what it last did, and the raw error tucked away for whoever needs it. */
  function failureDetailsHtml(reason, lastAction, rawError) {
    let html = `<div class="reason">${escapeHtml(reason || 'Failed.')}</div>`;
    if (lastAction) html += `<div class="last-action">Last thing it did: ${escapeHtml(lastAction)}</div>`;
    if (rawError) html += `<details><summary>Technical details</summary><pre>${escapeHtml(rawError)}</pre></details>`;
    return html;
  }

  /** A per-test.step() breakdown for a spec that used test.step() — see StepOutcome in jsonReport.mts. */
  function renderStepTable(steps) {
    const rows = steps.map((step, i) => {
      const knownBug = !step.passed && !step.notRun && /known crash|known bug/i.test(step.title);
      let cls, label, details;
      if (step.passed) {
        cls = 'pass';
        label = '✅ Passed';
        details = `<div>${escapeHtml(step.evidence)}</div>`;
      } else if (step.notRun) {
        cls = 'notrun';
        label = '— Not run';
        details = `<div>${escapeHtml(step.evidence)}</div>`;
      } else {
        cls = knownBug ? 'fail known' : 'fail';
        label = knownBug ? '⚠️ Known bug' : '❌ Failed';
        details = failureDetailsHtml(step.evidence, step.lastAction, step.rawError);
      }
      return stepRowHtml(i + 1, step.title, cls, label, details, formatDuration(step.durationMs));
    });
    return stepTableHtml(rows.join(''));
  }

  /** Same table, one row, for a spec without test.step()s. */
  function renderSingleSpecTable(spec, passed) {
    const details = passed
      ? '<div>All checks passed.</div>'
      : failureDetailsHtml(spec.reason, spec.lastAction, spec.errorMessage && spec.errorMessage.split('\n').filter((l) => l.trim()).slice(0, 6).join('\n'));
    return stepTableHtml(
      stepRowHtml(1, spec.title, passed ? 'pass' : 'fail', passed ? '✅ Passed' : '❌ Failed', details, formatDuration(spec.durationMs)),
    );
  }

  function applyState(state) {
    for (const suite of Object.values(suiteMeta)) {
      const s = state.suites[suite.id];
      if (!s) continue;
      setBadge(suite.id, s.status);
      setAttemptNote(suite.id, s.attemptNumber, s.maxAttempts);
      clearLog(suite.id);
      s.log.forEach((line) => appendLog(suite.id, line));
      renderSpecs(suite.id, s.specs, s.status);
      if (s.status === 'running') renderLiveTable(suite.id);
    }
    queueLength = (state.queue || []).length;
    setRunning(state.running);
  }

  // Buttons stay enabled while a run is in progress — picking another suite
  // then queues it (see triggerRun) instead of being rejected.
  function setRunning(running) {
    isRunning = running;
    runStatus.classList.toggle('running', running);
    updateStatusText();
  }

  function updateStatusText() {
    if (isRunning && queueLength > 0) runStatus.textContent = `Running… (${queueLength} queued)`;
    else if (isRunning) runStatus.textContent = 'Running…';
    else runStatus.textContent = 'Idle';
  }

  function roleLabel(role) {
    return role === 'operator' ? 'Operator' : 'Administrator';
  }

  function runContextLabel(role, instance) {
    return roleLabel(role) + ' on ' + instance;
  }

  function showBanner(passed, role, instance) {
    runBanner.className = passed ? 'pass' : 'fail';
    runBanner.textContent = 'Overall: ' + (passed ? 'PASS' : 'FAIL') + ' (as ' + runContextLabel(role, instance) + ')';
  }

  function suiteAvailable(suiteId) {
    const instance = instanceMeta[instanceSelect.value];
    return !instance || !instance.excludedSuites.includes(suiteId);
  }

  // Suites the selected instance excludes (config/instances.json) are greyed
  // out and can't be picked — e.g. Fine Creation is testee-only.
  function applyInstanceAvailability() {
    const instance = instanceMeta[instanceSelect.value];
    for (const [id, ref] of Object.entries(cardRefs)) {
      const available = suiteAvailable(id);
      ref.card.classList.toggle('unavailable', !available);
      ref.checkbox.disabled = !available;
      if (!available) ref.checkbox.checked = false;
      else if (ref.checkbox.dataset.autoUnchecked === '1') ref.checkbox.checked = true;
      ref.checkbox.dataset.autoUnchecked = available ? '' : '1';
      ref.runOneBtn.disabled = !available || runBtn.disabled;
      ref.unavailableNote.textContent = available ? '' : 'Not available on ' + (instance ? instance.title : instanceSelect.value) + '.';
    }
    instanceNote.textContent = instance && instance.unverified ? '⚠ ' + instance.unverified : '';
  }

  function handleEvent(event) {
    switch (event.type) {
      case 'run-start':
        runBanner.className = '';
        currentRunRole = event.role || 'administrator';
        roleSelect.value = currentRunRole;
        currentRunInstance = event.instance || 'testee';
        instanceSelect.value = currentRunInstance;
        applyInstanceAvailability();
        setRunning(true);
        break;
      case 'suite-start':
        setBadge(event.suiteId, 'running');
        setAttemptNote(event.suiteId, event.attemptNumber, event.maxAttempts);
        if (event.attemptNumber === 1) {
          clearLog(event.suiteId);
        } else {
          // A retry starts the whole test over — its live table does too.
          resetLiveSteps(event.suiteId);
        }
        renderSpecs(event.suiteId, [], 'running');
        break;
      case 'suite-log':
        appendLog(event.suiteId, event.line);
        break;
      case 'suite-attempt-done':
        renderSpecs(event.suiteId, event.specs, event.passed ? 'passed' : 'failed');
        setBadge(event.suiteId, event.passed ? 'passed' : 'failed');
        break;
      case 'suite-retry':
        appendLog(event.suiteId, `[dashboard] retrying — attempt ${event.nextAttemptNumber}/${event.maxAttempts}`);
        break;
      case 'suite-stopped':
        setBadge(event.suiteId, 'stopped');
        break;
      case 'suite-done':
        setBadge(event.suiteId, finalAttemptPassed(event.result.finalAttempt) ? 'passed' : 'failed');
        break;
      case 'run-done': {
        setRunning(false);
        const passed = event.results.every((r) => finalAttemptPassed(r.finalAttempt));
        showBanner(passed, currentRunRole, currentRunInstance);
        break;
      }
      case 'run-stopped': {
        // Only the suite(s) that had actually started get a suite-stopped
        // event of their own (handled above) — any others still sitting
        // 'queued'/'pending' from this same batch were marked 'stopped'
        // server-side (see server.mts's handleRunEvent) but never got an
        // event telling this tab so individually. Re-fetching state resyncs
        // every card in one shot instead of guessing which ids those were.
        runBanner.className = 'stopped';
        runBanner.textContent = 'Run stopped by user (as ' + runContextLabel(currentRunRole, currentRunInstance) + ').';
        fetch('/api/state')
          .then((r) => r.json())
          .then(applyState)
          .catch(() => setRunning(false));
        break;
      }
      case 'run-error':
        setRunning(false);
        runBanner.className = 'fail';
        runBanner.textContent = 'Run error: ' + event.message;
        break;
      case 'queue-update': {
        queueLength = event.queue.length;
        updateStatusText();
        const queuedIds = new Set(event.queue.flat());
        for (const [id, ref] of Object.entries(cardRefs)) {
          if (!queuedIds.has(id)) continue;
          if (ref.badge.classList.contains('running')) continue; // still finishing its current run, not the queued one
          setBadge(id, 'queued');
        }
        break;
      }
    }
  }

  // Clicking while a run is already in progress queues the request instead
  // of being rejected — the server starts it automatically once the current
  // run (and anything queued ahead of it) finishes.
  async function triggerRun(suiteIds) {
    if (suiteIds.length === 0) {
      runStatus.textContent = 'Pick at least one suite.';
      return;
    }
    if (!isRunning) {
      runBanner.className = '';
      runStatus.textContent = 'Starting…';
    }

    try {
      const response = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          suiteIds,
          retries: Number(retriesInput.value) || 0,
          headed: headedInput.checked,
          role: roleSelect.value,
          instance: instanceSelect.value,
        }),
      });

      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        runStatus.textContent = body.error || `Failed to start (HTTP ${response.status})`;
        return;
      }
      if (body.started) setRunning(true);
      if (body.queued) {
        queueLength = body.position;
        for (const id of suiteIds) {
          if (cardRefs[id] && cardRefs[id].badge.classList.contains('running')) continue;
          setBadge(id, 'queued');
        }
        updateStatusText();
      }
    } catch (error) {
      runStatus.textContent = 'Failed to start (network error)';
    }
  }

  // Kills the actual `playwright test` process behind whichever suite is
  // running — there's only ever one, so this always stops the current suite
  // (and cuts short the rest of its batch, if it was part of a multi-suite
  // "Run Selected"), regardless of which card's End button was clicked.
  async function stopRun(suiteId) {
    const ref = cardRefs[suiteId];
    ref.endOneBtn.disabled = true;
    ref.endOneBtn.textContent = 'Ending…';
    try {
      const response = await fetch('/api/stop', { method: 'POST' });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        runStatus.textContent = body.error || `Failed to stop (HTTP ${response.status})`;
        ref.endOneBtn.disabled = false;
        ref.endOneBtn.textContent = 'End';
      }
      // On success, the suite-stopped/run-stopped SSE events (which always
      // follow) update badges and re-hide this button — nothing more to do here.
    } catch (error) {
      runStatus.textContent = 'Failed to stop (network error)';
      ref.endOneBtn.disabled = false;
      ref.endOneBtn.textContent = 'End';
    }
  }

  async function init() {
    const suites = await fetch('/api/suites').then((r) => r.json());
    suiteMeta = Object.fromEntries(suites.map((s) => [s.id, s]));
    suites.forEach(renderSuiteCard);

    const instances = await fetch('/api/instances').then((r) => r.json());
    instanceMeta = Object.fromEntries(instances.map((i) => [i.id, i]));
    instanceSelect.innerHTML = instances
      .map((i) => `<option value="${escapeHtml(i.id)}">${escapeHtml(i.title)}${i.unverified ? ' (unverified)' : ''}</option>`)
      .join('');
    instanceSelect.addEventListener('change', applyInstanceAvailability);

    const state = await fetch('/api/state').then((r) => r.json());
    if (state.role) {
      currentRunRole = state.role;
      roleSelect.value = state.role;
    }
    if (state.instance && instanceMeta[state.instance]) {
      currentRunInstance = state.instance;
      instanceSelect.value = state.instance;
    }
    applyState(state);

    // Buttons start disabled (in markup) until suites/state finish loading;
    // from here on they stay enabled even mid-run, since clicking then queues.
    runBtn.disabled = false;
    for (const ref of Object.values(cardRefs)) ref.runOneBtn.disabled = false;
    applyInstanceAvailability();

    const source = new EventSource('/api/events');
    source.onmessage = (message) => handleEvent(JSON.parse(message.data));
  }

  runBtn.addEventListener('click', () => {
    const suiteIds = Object.entries(cardRefs)
      .filter(([id, ref]) => ref.checkbox.checked && suiteAvailable(id))
      .map(([id]) => id);
    triggerRun(suiteIds);
  });

  init();
})();
</script>
<script>
/* Environment switch (Tenant-based / Multitenant). The two environments are separate pages with separate
   servers-side code (multitenant lives under /mt/); this only moves between them and touches nothing else. */
(function () {
  const environment = document.getElementById('environment');
  if (!environment) return;
  environment.addEventListener('change', function () {
    if (environment.value === 'multitenant') window.location.assign('/mt/');
  });
})();
</script>
</body>
</html>
